<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Access Auditor</title>
<style>
:root{
  --side:#ecebe8; --pane:#ffffff; --pane2:#f6f6f4; --fg:#1d1d1f; --mut:#6e6e73; --faint:#a1a1a6;
  --line:rgba(0,0,0,.08); --hover:rgba(0,0,0,.045); --sel:rgba(0,0,0,.07);
  --acc:#2f6bf0; --accfg:#fff; --acc-soft:rgba(47,107,240,.10);
  --high:#d93b2b; --high-soft:rgba(217,59,43,.10);
  --med:#c27a0e; --med-soft:rgba(232,154,30,.14);
  --low:#2f8f4e; --low-soft:rgba(47,143,78,.11);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --r:12px;
}
/* dark: follows the system unless a theme is chosen (data-theme on <html>) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --side:#262624; --pane:#1c1c1e; --pane2:#232325; --fg:#f2f2f2; --mut:#a1a1a6; --faint:#6e6e73;
  --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.09);
  --acc:#4c86ff; --acc-soft:rgba(76,134,255,.16);
  --high:#ff6b5b; --high-soft:rgba(255,107,91,.14);
  --med:#f2b44c; --med-soft:rgba(242,180,76,.14);
  --low:#5fcf83; --low-soft:rgba(95,207,131,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --side:#262624; --pane:#1c1c1e; --pane2:#232325; --fg:#f2f2f2; --mut:#a1a1a6; --faint:#6e6e73;
  --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.09);
  --acc:#4c86ff; --acc-soft:rgba(76,134,255,.16);
  --high:#ff6b5b; --high-soft:rgba(255,107,91,.14);
  --med:#f2b44c; --med-soft:rgba(242,180,76,.14);
  --low:#5fcf83; --low-soft:rgba(95,207,131,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:var(--fg);
  background:var(--side);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none}
html.native body{background:transparent}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;padding:14px 10px 12px;overflow:auto}
html.native .side{padding-top:46px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,#3c6ff0,#1b2c73);display:grid;place-items:center;flex:none}
.brand b{font-size:14px;display:block}.brand span{font-size:11px;color:var(--mut)}
.navh{font-size:11px;font-weight:600;color:var(--faint);padding:12px 10px 4px;letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:7px;border:0;background:none;
  color:inherit;font:inherit;text-align:left;cursor:default}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);font-weight:600}
.nav svg{width:16px;height:16px;flex:none;color:var(--acc)}
.nav .n{margin-left:auto;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.nav .n.alert{color:#fff;background:var(--high);border-radius:99px;padding:0 6px;font-weight:600}
.av{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
.sidefoot{margin-top:auto;padding:12px 8px 0;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut)}

/* ---------- main pane ---------- */
.main{background:var(--pane);border-left:1px solid var(--line);display:flex;min-width:0;height:100vh}
.content{flex:1;min-width:0;overflow:auto;user-select:text;-webkit-user-select:text}
.head{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--pane) 88%,transparent);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);padding:18px 28px 12px;border-bottom:1px solid transparent}
html.native .head{padding-top:30px}
.head.scrolled{border-color:var(--line)}
.head h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--mut)}
.body{padding:8px 28px 40px}

.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--pane);color:var(--fg);border-radius:7px;
  padding:5px 12px;cursor:default;box-shadow:0 1px 1px rgba(0,0,0,.04);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--pane2)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.btn.danger{background:var(--high);border-color:var(--high);color:#fff}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--acc)}
.btn:disabled{opacity:.45}
.btn svg{width:14px;height:14px}

/* overview */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--pane2);border-radius:16px;padding:22px 26px;margin-top:8px}
.ring{position:relative;width:118px;height:118px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-size:32px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1}
.ring .v span{font-size:11px;color:var(--mut)}
.hero h2{margin:0 0 4px;font-size:17px}
.hero p{margin:0 0 14px;color:var(--mut);max-width:520px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--pane)}
.tile span{font-size:11.5px;color:var(--mut)}
.tile b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile.alert b{color:var(--high)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 8px}
.sec h3{font-size:13px;margin:0;font-weight:600}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--pane);overflow:hidden}
.bars{padding:12px 14px}
.bar{display:grid;grid-template-columns:120px 1fr 28px;gap:10px;align-items:center;padding:5px 0;font-size:12px}
.bar .t{height:7px;border-radius:99px;background:var(--pane2);overflow:hidden;display:flex}
.bar .t i{display:block;height:100%}
.bar .c{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}

a.btn{text-decoration:none}
.hero{grid-template-columns:auto 1fr auto;gap:26px;padding:22px 24px}
.hero-btns{display:flex;gap:8px;flex-wrap:wrap}
.hero-stats{display:flex;gap:0;align-self:stretch;align-items:center;border-left:1px solid var(--line);padding-left:6px}
.hero-stats div{padding:0 18px;text-align:left;min-width:86px}
.hero-stats div+div{border-left:1px solid var(--line)}
.hero-stats b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.hero-stats b.alert{color:var(--high)}
.hero-stats span{font-size:11.5px;color:var(--mut)}
.prot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--pane)}
.pt .pi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--pane2);color:var(--mut)}
.pt.on .pi{background:var(--low-soft);color:var(--low)}
.pt .pi svg{width:16px;height:16px}
.pt .pm{flex:1;min-width:0}.pt .pm b{display:block;font-size:13px}.pt .pm span{font-size:12px;color:var(--mut)}
.legend{display:flex;gap:14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* toolbar */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.search{display:flex;align-items:center;gap:6px;background:var(--pane2);border-radius:8px;padding:5px 10px;flex:1;min-width:180px;max-width:320px}
.search svg{width:14px;height:14px;color:var(--faint);flex:none}
.search input{border:0;background:none;outline:none;font:inherit;color:inherit;width:100%}
.seg{display:inline-flex;background:var(--pane2);border-radius:8px;padding:2px}
.seg button{border:0;background:none;font:inherit;color:var(--mut);padding:3px 11px;border-radius:6px;cursor:default}
.seg button.on{background:var(--pane);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.switch{display:inline-flex;align-items:center;gap:7px;color:var(--mut);cursor:default}
.switch input{appearance:none;width:28px;height:16px;border-radius:99px;background:var(--faint);position:relative;margin:0;transition:.15s}
.switch input::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.switch input:checked{background:var(--acc)}.switch input:checked::after{left:14px}

/* list */
.group h4{font-size:11px;font-weight:600;color:var(--faint);margin:18px 0 6px;letter-spacing:.02em;text-transform:uppercase}
.item{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;cursor:default}
.item+.item{box-shadow:0 -1px 0 var(--line)}
.item:hover{background:var(--hover);box-shadow:none}
.item:hover+.item{box-shadow:none}
.item.sel{background:var(--acc-soft);box-shadow:none}
.item.sel+.item{box-shadow:none}
.item.done .ttl{color:var(--mut)}
.ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.ic svg{width:16px;height:16px}
.ic.high{background:var(--high-soft);color:var(--high)}.ic.medium{background:var(--med-soft);color:var(--med)}.ic.low{background:var(--low-soft);color:var(--low)}
.ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:8px}
.badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge.high{background:var(--high-soft);color:var(--high)}.badge.medium{background:var(--med-soft);color:var(--med)}.badge.low{background:var(--low-soft);color:var(--low)}
.badge.ok{background:var(--pane2);color:var(--mut)}
.badge.new{background:var(--acc);color:#fff}
.newcard{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.chev{color:var(--faint);width:14px;height:14px}

/* inspector */
.insp{width:0;overflow:hidden;border-left:1px solid var(--line);background:var(--pane2);transition:width .2s ease;flex:none}
.insp.open{width:360px}
.insp-in{width:360px;height:100%;overflow:auto;padding:22px 22px 28px;user-select:text;-webkit-user-select:text}
html.native .insp-in{padding-top:34px}
.insp .x{float:right;border:0;background:var(--hover);width:24px;height:24px;border-radius:50%;color:var(--mut);cursor:default;font-size:14px;line-height:1}
.insp h2{font-size:16px;margin:14px 0 6px;overflow-wrap:anywhere}
.insp .lead{color:var(--mut);margin:0 0 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kv{border:1px solid var(--line);background:var(--pane);border-radius:10px;padding:2px 12px;margin-bottom:16px}
.kv div{display:grid;grid-template-columns:80px 1fr;gap:10px;padding:8px 0;font-size:12px}
.kv div+div{border-top:1px solid var(--line)}
.kv dt{color:var(--mut)}.kv dd{margin:0;overflow-wrap:anywhere}
.explain{border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px}
.explain b{display:block;margin-bottom:3px}
.explain.high{background:var(--high-soft)}.explain.medium{background:var(--med-soft)}.explain.low{background:var(--low-soft)}
.acts{display:flex;flex-direction:column;gap:8px}
.acts .btn{justify-content:center;padding:8px 12px}
.hint{font-size:12px;color:var(--mut);background:var(--pane);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* selection + bulk bar */
.item{grid-template-columns:auto 32px 1fr auto}
.ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;cursor:default}
.ck.on{background:var(--acc);border-color:var(--acc)}
.ck.on::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ck.part{background:var(--acc);border-color:var(--acc)}.ck.part::after{content:"";width:8px;height:2px;background:#fff;border-radius:2px}
.nock .ck{display:none}.nock .item{grid-template-columns:32px 1fr auto}
.bulk{position:sticky;bottom:16px;margin:18px auto 0;width:max-content;max-width:100%;display:flex;align-items:center;gap:10px;
  background:var(--fg);color:var(--pane);padding:8px 8px 8px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:6}
.bulk .btn{border-color:transparent}
.bulk .btn.plain{background:transparent;color:var(--pane)}
.badge.exp{background:var(--acc-soft);color:var(--acc)}
.expiry{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 16px}
.expiry .seg button{padding:3px 9px}
.lbl{font-size:11px;font-weight:600;color:var(--faint);margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em}

/* misc */
.empty{text-align:center;color:var(--mut);padding:60px 20px}
.empty .big{font-size:34px;margin-bottom:6px}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--acc-soft);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.note svg{width:18px;height:18px;color:var(--acc);flex:none;margin-top:1px}
.note p{margin:2px 0 8px;color:var(--mut)}
.link{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:10px 12px;text-decoration:none;color:inherit}
.link+.link{border-top:1px solid var(--line)}
.link:hover{background:var(--hover)}
.link .ic{background:var(--acc-soft);color:var(--acc)}
.log{font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px 14px;white-space:pre-wrap;color:var(--mut);max-height:320px;overflow:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--pane);padding:10px 16px;
  border-radius:10px;box-shadow:var(--shadow);transition:.2s;max-width:480px;font-weight:500;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* welcome / setup */
.setup{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:24px;
  background:color-mix(in srgb,var(--side) 55%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.setup.open{display:grid}
.sbox{width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--pane);border-radius:18px;box-shadow:var(--shadow),0 24px 60px rgba(0,0,0,.18);
  padding:28px 30px 22px;user-select:text;-webkit-user-select:text}
.sbox .stepno{font-size:11.5px;font-weight:600;color:var(--acc);letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px}
.sbox h2{font-size:21px;margin:0 0 6px;letter-spacing:-.01em}
.sbox .lead{color:var(--mut);margin:0 0 18px;font-size:13.5px}
.sbig{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;margin-bottom:16px;background:var(--acc-soft);color:var(--acc)}
.sbig svg{width:28px;height:28px}
.srow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.srow .ic{flex:none}
.srow b{display:block;margin-bottom:2px}
.srow p{margin:0;color:var(--mut);font-size:12.5px}
.srow .switch{margin-left:auto;align-self:center;flex:none}
.ok-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px}
.ok-pill.yes{background:var(--low-soft);color:var(--low)}.ok-pill.no{background:var(--med-soft);color:var(--med)}
.steps{margin:6px 0 16px;padding-left:20px;color:var(--mut)}.steps li{margin:4px 0}
.sfoot{display:flex;align-items:center;gap:8px;margin-top:20px}
.dots{display:flex;gap:6px;margin-right:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}

::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:content-box}

@media (max-width:1000px){.hero{grid-template-columns:auto 1fr}.hero-stats{grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}.hero-stats div:first-child{padding-left:0}}
@media (max-width:900px){.prot{grid-template-columns:1fr}.split{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.insp.open{width:300px}.insp-in{width:300px}}
@media (max-width:640px){.app{grid-template-columns:1fr}.side{display:none}.hero{grid-template-columns:1fr}.head,.body{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6z" fill="#fff" stroke="none"/><path d="M9 12l2 2 4-4" stroke="#2849b8"/></svg></div>
      <div><b>Access Auditor</b><span>AI agent permissions</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidefoot"><button class="btn ghost" data-setup style="padding:3px 4px;font-size:11px">Setup</button><span id="when">Scanning…</span><button class="btn ghost" id="themeBtn" style="margin-left:auto;padding:3px 6px"></button><button class="btn ghost" id="rescan" title="Rescan (⌘R)" style="padding:3px 6px"></button></div>
  </aside>
  <section class="main">
    <div class="content" id="content">
      <div class="head" id="head"><h1 id="h1">Overview</h1><p id="hp"></p><div id="toolbar"></div></div>
      <div class="body" id="body"></div>
    </div>
    <aside class="insp" id="insp"><div class="insp-in" id="inspIn"></div></aside>
  </section>
</div>
<div class="toast" id="toast"></div>
<div class="setup" id="setup"><div class="sbox" id="sbox"></div></div>

<script>
const TOKEN = '__TOKEN__';
if (new URLSearchParams(location.search).has('native')) document.documentElement.classList.add('native');
try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}

const api = (p, body) => fetch('/api/' + p, { method: body ? 'POST' : 'GET', headers: { 'x-token': TOKEN, 'content-type': 'application/json' }, body: body && JSON.stringify(body) })
  .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const RANK = { high: 0, medium: 1, low: 2 };
const RISK_LABEL = { high: 'High risk', medium: 'Medium', low: 'Low' };

// ---------- icons ----------
const P = {
  overview: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  cloud: '<path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 1.5A4 4 0 0 0 6.5 19z"/>',

const AGENT_COLORS = ['#d97757', '#2f6bf0', '#8e5bd6', '#1f9d74', '#d6476b', '#c28a16', '#4a6378'];
const agentColor = a => AGENT_COLORS[[...a].reduce((s, c) => s + c.charCodeAt(0), 0) % AGENT_COLORS.length];
const avatar = a => `<span class="av" style="background:${agentColor(a)}">${esc(a.replace(/^.*\./, '')[0].toUpperCase())}</span>`;

// ---------- state ----------
let data = null, view = 'overview', agentFilter = null, selected = null, gateOn = false, scope = 'ai';
const picked = new Set(); // grants ticked for bulk actions
const REVOCABLE = ['removeArrayItem', 'deleteKey', 'setFalse', 'tccReset', 'disableLaunchAgent', 'uninstallExt', 'killProcess', 'removeFolder'];
const canRevoke = f => REVOCABLE.includes(f.action.kind);
const timeLeft = iso => { const ms = Date.parse(iso) - Date.now(); if (ms <= 0) return 'now'; const h = ms / 3600e3; return h < 1 ? Math.ceil(ms / 60e3) + 'm' : h < 48 ? Math.round(h) + 'h' : Math.round(h / 24) + 'd'; };
const ui = { q: '', risk: '', hideReviewed: false };

const toast = (m, ms = 3800) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); };

async function scan() {
  $('#rescan').innerHTML = icon('refresh', 'spin');
  let settings = {};
  try { [data, { installed: gateOn }, settings] = await Promise.all([api('scan'), api('gate/status'), api('settings')]); scope = settings.scope; }
  catch (e) { $('#when').textContent = e.message; return; }
  finally { $('#rescan').innerHTML = icon('refresh'); }
  if (settings.theme && !themeLoaded) { themeLoaded = true; applyTheme(settings.theme, false); }
  if (!settings.onboarded && !setupShownOnce) { setupShownOnce = true; openSetup(); }
  if ($('#setup').classList.contains('open')) renderSetup();
  $('#when').textContent = 'Scanned ' + new Date(data.scannedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (selected && !data.findings.some(f => f.id === selected)) selected = null;
  [...picked].forEach(i => { if (!data.findings.some(f => f.id === i)) picked.delete(i); });
  render();
}

function score() {
  const open = data.findings.filter(f => !f.reviewedAt);
  const w = open.reduce((s, f) => s + ({ high: 12, medium: 4, low: 1 }[f.risk]), 0);
  return Math.round(100 * Math.exp(-w / 80)); // falls gradually: never stuck at 0, still drops fast for broad access
}

// ---------- rendering ----------
function render() { renderNav(); renderMain(); renderInspector(); }

function renderNav() {
  const f = data.findings;
  const openHigh = f.filter(x => x.risk === 'high' && !x.reviewedAt).length;
  const agents = {};
  f.forEach(x => agents[x.agent] = (agents[x.agent] || 0) + 1);
  const item = (key, label, ic, n, extra = '') =>
    `<button class="nav ${view === key && (key !== 'agent' || agentFilter === extra) ? 'on' : ''}" data-view="${key}" data-agent="${esc(extra)}">${ic}<span>${esc(label)}</span>${n !== '' ? `<span class="n ${typeof n === 'string' && n.startsWith('!') ? 'alert' : ''}">${String(n).replace('!', '')}</span>` : ''}</button>`;
  $('#nav').innerHTML =
    item('overview', 'Overview', icon('overview'), openHigh ? '!' + openHigh : '') +
    item('all', 'All grants', icon('list'), f.length) +
    (f.some(x => x.isNew) ? item('new', 'New', icon('info'), '!' + f.filter(x => x.isNew).length) : '') +
    `<div class="navh">Agents</div>` +
    Object.entries(agents).sort((a, b) => b[1] - a[1]).map(([a, n]) => item('agent', a, avatar(a), n, a)).join('') +
    `<div class="navh">More</div>` +
    item('decisions', 'Decisions', icon('hand'), '') +
    item('cloud', 'Online accounts', icon('cloud'), '') +
    item('history', 'History & undo', icon('history'), '');
}

function setHead(title, sub, toolbar = '') {
  $('#h1').textContent = title; $('#hp').textContent = sub; $('#toolbar').innerHTML = toolbar;
}

function renderMain() {
  if (view === 'overview') return renderOverview();
  if (view === 'cloud') return renderCloud();
  if (view === 'history') return renderHistory();
  if (view === 'decisions') return renderDecisions();
  renderList();
}

function renderOverview() {
  const f = data.findings, open = f.filter(x => !x.reviewedAt);
  const s = score();
  const tone = s >= 80 ? ['var(--low)', 'Looking good', 'Only a few grants are left to review.'] : s >= 50 ? ['var(--med)', 'Worth a look', 'Some agents have more access than they might need.'] : ['var(--high)', 'Needs attention', 'Agents have broad access you haven\'t reviewed yet.'];
  const C = 2 * Math.PI * 50;
  setHead('Overview', `${f.length} grants across ${new Set(f.map(x => x.agent)).size} agents`);
  const top = open.slice().sort((a, b) => RANK[a.risk] - RANK[b.risk]).slice(0, 6);
  const cats = {};
  f.forEach(x => { cats[x.category] ||= { high: 0, medium: 0, low: 0, n: 0 }; cats[x.category][x.risk]++; cats[x.category].n++; });
  const max = Math.max(1, ...Object.values(cats).map(c => c.n));
  const tccMissing = !data.tcc.readable.length;
  const highN = f.filter(x => x.risk === 'high' && !x.reviewedAt).length;
  const agentsN = new Set(f.map(x => x.agent)).size;
  const fda = !tccMissing;
  const prot = (ic, label, sub, ctrl, ok) => `<div class="pt ${ok ? 'on' : ''}"><span class="pi">${icon(ic)}</span><div class="pm"><b>${label}</b><span>${sub}</span></div>${ctrl}</div>`;
  $('#body').innerHTML = `
    <div class="hero">
      <div class="ring">
        <svg width="112" height="112" viewBox="0 0 118 118"><circle cx="59" cy="59" r="50" stroke="var(--line)" stroke-width="10" fill="none"/>
        <circle cx="59" cy="59" r="50" stroke="${tone[0]}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - s / 100)}"/></svg>
        <div class="v"><div><b>${s}</b><span>safety score</span></div></div>
      </div>
      <div class="hero-txt"><h2>${tone[1]}</h2><p>${tone[2]} Revoke what you don't use, and mark what you trust as reviewed.</p>
        <div class="hero-btns">${highN ? `<button class="btn primary" data-go="all" data-risk="high">Review ${highN} high-risk</button>` : ''}<button class="btn ${highN ? '' : 'primary'}" data-go="all">See all grants</button></div></div>
      <div class="hero-stats">
        <div><b class="${highN ? 'alert' : ''}">${highN}</b><span>High risk</span></div>
        <div><b>${open.length}</b><span>To review</span></div>
        <div><b>${agentsN}</b><span>Agents</span></div>
      </div>
    </div>
    ${f.some(x => x.isNew) ? `<div class="sec"><h3>New since you last looked</h3><button class="btn ghost" data-ackall>Mark all as seen</button></div>
      <div class="card newcard nock">${f.filter(x => x.isNew).slice(0, 5).map(x => row(x)).join('')}</div>` : ''}
    <div class="sec"><h3>Protection</h3><button class="btn ghost" data-setup>Setup</button></div>
    <div class="prot">
      ${prot('info', 'Live popups', 'New access from any agent', '<span class="ok-pill yes">On</span>', true)}
      ${prot('hand', 'Ask before Claude Code acts', gateOn ? 'You approve each new action' : 'Claude Code asks in its own window', `<label class="switch"><input type="checkbox" id="gateSw" ${gateOn ? 'checked' : ''}></label>`, gateOn)}
      ${prot('macOS privacy', 'macOS permissions', fda ? 'Screen, files, camera and more' : 'Needs Full Disk Access', fda ? '<span class="ok-pill yes">On</span>' : '<button class="btn" data-setup-step="1">Fix</button>', fda)}
      ${prot('Folder access', 'Watch all apps', scope === 'all' ? 'Every app, not just AI' : 'AI apps only', `<label class="switch"><input type="checkbox" id="scopeSw" ${scope === 'all' ? 'checked' : ''}></label>`, scope === 'all')}
    </div>
    <div class="split">
      <div><div class="sec"><h3>Top risks</h3><button class="btn ghost" data-go="all">View all</button></div>
        <div class="card nock">${top.length ? top.map(x => row(x)).join('') : `<div class="empty"><div class="big">✓</div>Everything has been reviewed.</div>`}</div></div>
      <div><div class="sec"><h3>By type</h3></div>
        <div class="card bars">${Object.entries(cats).sort((a, b) => b[1].n - a[1].n).map(([k, c]) => `
          <div class="bar"><span>${esc(k)}</span><span class="t">${['high', 'medium', 'low'].map(r => `<i style="width:${c[r] / max * 100}%;background:var(--${r === 'medium' ? 'med' : r})"></i>`).join('')}</span><span class="c">${c.n}</span></div>`).join('')}
          <div class="legend"><span><i style="background:var(--high)"></i>High</span><span><i style="background:var(--med)"></i>Medium</span><span><i style="background:var(--low)"></i>Low</span></div></div></div>
    </div>`;
}

// ctx: 'agent' = list is grouped by agent (don't repeat it), 'category' = grouped by type
function row(f, ctx) {
  const sub = [ctx === 'agent' ? '' : f.agent, ctx === 'category' ? '' : f.category, f.detail].filter(Boolean).join(' · ');
  return `<div class="item ${selected === f.id ? 'sel' : ''} ${f.reviewedAt ? 'done' : ''}" data-id="${f.id}">
    <span class="ck ${picked.has(f.id) ? 'on' : ''}" data-pick="${f.id}" title="Select"></span>
    <span class="ic ${f.risk}">${icon(f.category)}</span>
    <div style="min-width:0"><div class="ttl">${esc(f.title)}</div><div class="sub" title="${esc(f.detail)}">${esc(sub)}</div></div>
    <div class="meta">${f.expiresAt ? `<span class="badge exp" title="Revoked automatically ${new Date(f.expiresAt).toLocaleString()}">⏱ ${timeLeft(f.expiresAt)}</span>` : ''}${f.isNew ? '<span class="badge new">New</span>' : ''}${f.reviewedAt ? '<span class="badge ok">Reviewed</span>' : `<span class="badge ${f.risk}">${RISK_LABEL[f.risk]}</span>`}${icon('chev', 'chev')}</div>
  </div>`;
}

function renderList() {
  const isAgent = view === 'agent', isNew = view === 'new';
  const base = isAgent ? data.findings.filter(f => f.agent === agentFilter) : isNew ? data.findings.filter(f => f.isNew) : data.findings;
  const q = ui.q.toLowerCase();
  const rows = base.filter(f => (!ui.risk || f.risk === ui.risk) && (!ui.hideReviewed || !f.reviewedAt) &&
    (!q || [f.agent, f.title, f.detail, f.source, f.category].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => (!!a.reviewedAt - !!b.reviewedAt) || RANK[a.risk] - RANK[b.risk]);
  const counts = r => base.filter(f => !r || f.risk === r).length;
  const allPicked = rows.length && rows.every(f => picked.has(f.id)), somePicked = rows.some(f => picked.has(f.id));
  const toolbarHtml = `<div class="tools">
      <span class="ck ${allPicked ? 'on' : somePicked ? 'part' : ''}" data-pickall title="Select all shown"></span>
      <label class="search">${icon('search')}<input id="q" placeholder="Search grants" value="${esc(ui.q)}"></label>
      <div class="seg" id="seg">${[['', 'All'], ['high', 'High'], ['medium', 'Medium'], ['low', 'Low']].map(([v, l]) => `<button data-risk="${v}" class="${ui.risk === v ? 'on' : ''}">${l} ${counts(v)}</button>`).join('')}</div>
      <label class="switch"><input type="checkbox" id="hideRev" ${ui.hideReviewed ? 'checked' : ''}> Hide reviewed</label>
    </div>`;
  const hadFocus = document.activeElement && document.activeElement.id === 'q';
  setHead(isAgent ? agentFilter : isNew ? 'New since you last looked' : 'All grants',
    isAgent ? `Everything ${agentFilter} can access` : isNew ? 'Access an agent gained after your last check. Revoke it, or keep it to mark it as seen.' : 'Every permission, folder, server and key given to an AI agent',
    toolbarHtml + (isNew && base.length ? '<div style="margin-top:10px"><button class="btn" data-ackall>Mark all as seen</button></div>' : ''));
  if (hadFocus) { const i = $('#q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  const groups = {};
  rows.forEach(f => (groups[isAgent ? f.category : f.agent] ||= []).push(f));
  $('#body').innerHTML = rows.length
    ? Object.entries(groups).map(([g, fs]) => `<div class="group"><h4>${esc(g)} · ${fs.length}</h4>${fs.map(x => row(x, isAgent ? 'category' : 'agent')).join('')}</div>`).join('')
    : `<div class="empty"><div class="big">🎉</div>Nothing matches these filters.</div>`;
  window._shownIds = rows.map(f => f.id);
  renderBulk();
}

function renderBulk() {
  document.querySelector('.bulk')?.remove();
  if (!picked.size || !['all', 'agent', 'new'].includes(view)) return;
  const fs = data.findings.filter(f => picked.has(f.id));
  const rev = fs.filter(canRevoke).length;
  $('#body').insertAdjacentHTML('beforeend', `<div class="bulk"><b>${picked.size} selected</b>
    ${rev ? `<button class="btn danger" data-bulk="revoke">Revoke ${rev}</button>` : ''}
    <button class="btn" data-bulk="review">Mark reviewed</button>
    <button class="btn plain" data-bulk="clear">Clear</button></div>`);
}

function renderCloud() {
  setHead('Online accounts', 'These grants live in your online accounts, so they can\'t be scanned from your Mac. Check each one.');
  $('#body').innerHTML = `<div class="card" style="margin-top:8px">${data.manual.map(m => `
    <a class="link" href="${esc(m.url)}" target="_blank" rel="noopener"><span class="ic">${icon('cloud')}</span>
      <div><div class="ttl">${esc(m.name)}</div><div class="sub">${esc(new URL(m.url).host)}</div></div>${icon('ext', 'chev')}</a>`).join('')}</div>`;
}

async function renderDecisions() {
  setHead('Decisions', 'Every Allow and Deny you gave in the popup. Change your mind any time.');
  $('#body').innerHTML = '<div class="empty">Loading…</div>';
  const [list, tr] = await Promise.all([api('decisions'), api('uploads/trusted')]);
  if (view !== 'decisions') return;
  const trusted = tr.trusted.length ? `<div class="sec"><h3>Apps allowed to send data</h3></div>
    <div class="card nock">${tr.trusted.map(t => `<div class="item" style="grid-template-columns:32px 1fr auto"><span class="ic low">${icon('Data upload')}</span>
      <div style="min-width:0"><div class="ttl">${esc(t.label.split('/').pop().replace(/\.app$/, ''))}</div><div class="sub">${esc(t.label)}</div></div>
      <div class="meta"><button class="btn" data-untrust="${esc(t.key)}">Watch again</button></div></div>`).join('')}</div>
    <div class="sec"><h3>Claude Code requests</h3></div>` : '';
  if (!list.length) {
    $('#body').innerHTML = `${trusted}<div class="empty"><div class="big">✋</div>No decisions yet.<br>${gateOn ? 'When Claude Code asks for something, your answer will show up here.' : 'Turn on <b>Ask before Claude Code acts</b> on the Overview, and your answers will show up here.'}</div>`;
    return;
  }
  const when = iso => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  $('#body').innerHTML = `${trusted}<div class="card nock" style="margin-top:8px">${list.map(d => {
    const allowed = d.decision === 'allow';
    const status = d.blocked ? '<span class="badge high">Blocked</span>'
      : allowed && d.always ? (d.ruleActive ? '<span class="badge low">Always allowed</span>' : '<span class="badge ok">Rule removed</span>')
      : allowed ? '<span class="badge ok">Allowed once</span>' : '<span class="badge medium">Denied once</span>';
    const btns = [
      allowed && d.always && d.ruleActive && !d.blocked ? `<button class="btn" data-dec="revoke" data-did="${d.id}" title="Remove the saved rule; Claude Code will ask again">Revoke</button>` : '',
      !d.blocked ? `<button class="btn danger" data-dec="block" data-did="${d.id}" title="${esc(d.blockRule)}">Block from now on</button>` : `<button class="btn" data-dec="unblock" data-did="${d.id}" title="${esc(d.blockRule)}">Unblock</button>`,
    ].join('');
    return `<div class="item" style="grid-template-columns:32px 1fr auto">
      <span class="ic ${d.risk}">${icon(d.tool === 'Bash' ? 'Tool permission' : d.tool.startsWith('mcp__') ? 'MCP server' : 'hand')}</span>
      <div style="min-width:0"><div class="ttl" title="${esc(d.text)}">${esc(d.text || d.tool)}</div>
        <div class="sub">${esc(d.agent)} · ${esc(d.action)} · ${esc(when(d.at))}${d.cwd ? ' · ' + esc(d.cwd) : ''}</div></div>
      <div class="meta">${status}${btns}</div></div>`;
  }).join('')}</div>`;
}

async function renderHistory() {
  setHead('History & undo', 'A backup is saved before every change. Restore one to put the access back.');
  $('#body').innerHTML = '<div class="empty">Loading…</div>';
  const [bks, lg] = await Promise.all([api('backups'), api('log')]);
  if (view !== 'history') return;
  $('#body').innerHTML = `
    <div class="sec"><h3>Backups</h3></div>
    <div class="card nock">${bks.length ? bks.map(b => `<div class="item"><span class="ic low">${icon('history')}</span>
      <div style="min-width:0"><div class="ttl">${esc(b.original)}</div><div class="sub">${b.at ? new Date(b.at).toLocaleString() : ''}</div></div>
      <button class="btn" data-restore="${esc(b.name)}">Restore</button></div>`).join('') : '<div class="empty">No changes yet.</div>'}</div>
    <div class="sec"><h3>Activity</h3></div>
    <div class="card"><div class="log">${esc(lg.log.join('\n') || 'Nothing yet.')}</div></div>`;
}

function renderInspector() {
  const f = selected && data.findings.find(x => x.id === selected);
  $('#insp').classList.toggle('open', !!f);
  if (!f) return;
  const [head, text] = EXPLAIN[f.category] || ['', ''];
  const a = f.action, revocable = canRevoke(f);
  const EXP = [['', 'Never'], ['1', '1 hour'], ['24', '1 day'], ['168', '7 days'], ['720', '30 days']];
  $('#inspIn').innerHTML = `
    <button class="x" data-close title="Close">×</button>
    <span class="ic ${f.risk}" style="width:40px;height:40px;border-radius:11px">${icon(f.category)}</span>
    <h2>${esc(f.title)}</h2>
    <p class="lead">${avatar(f.agent)} ${esc(f.agent)} · <span class="badge ${f.risk}">${RISK_LABEL[f.risk]}</span></p>
    <div class="explain ${f.risk}"><b>${esc(head)}</b>${esc(text)}</div>
    <dl class="kv">
      <div><dt>Type</dt><dd>${esc(f.category)}</dd></div>
      <div><dt>Details</dt><dd>${esc(f.detail)}</dd></div>
      <div><dt>Stored in</dt><dd>${esc(f.source)}</dd></div>
      <div><dt>Status</dt><dd>${f.reviewedAt ? 'Reviewed ' + new Date(f.reviewedAt).toLocaleDateString() : 'Not reviewed'}</dd></div>
    </dl>
    ${revocable ? `<p class="lbl">Revoke automatically</p>
    <div class="expiry"><div class="seg">${EXP.map(([v, l]) => `<button data-exp="${v}" data-for="${f.id}" class="${!f.expiresAt && v === '' ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${f.expiresAt ? `<span class="detail" style="width:100%">Will be revoked ${esc(new Date(f.expiresAt).toLocaleString())} (in ${timeLeft(f.expiresAt)})</span>` : ''}</div>` : ''}
    <div class="acts">
      ${revocable ? `<button class="btn danger" data-revoke="${f.id}">${a.kind === 'killProcess' ? 'Stop it' : a.kind === 'removeFolder' ? 'Remove skill' : 'Revoke access'}</button>`
        : a.kind === 'openApp' ? `<button class="btn primary" data-openapp="${f.id}">${esc(a.label)}</button><div class="hint">${esc(a.hint)}</div>`
        : a.kind === 'link' ? `<a class="btn primary" href="${esc(a.url)}">${esc(a.hint || 'Open settings')}</a>`
        : `<div class="hint">${esc(a.hint || 'Change this one by hand.')}</div>`}
      ${f.category === 'Data upload' ? `<button class="btn" data-trust="${f.id}">Always allow this app</button>` : ''}
      <button class="btn" data-rev="${f.id}" data-on="${f.reviewedAt ? 0 : 1}">${f.reviewedAt ? 'Mark as not reviewed' : 'Keep it — mark as reviewed'}</button>
    </div>`;
}

// ---------- events ----------
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-trust],[data-untrust],[data-dec],[data-pick],[data-pickall],[data-bulk],[data-exp],[data-openapp],[data-ackall],[data-view],[data-go],[data-id],[data-close],[data-revoke],[data-rev],[data-restore],#seg button,#rescan');
  if (!t) return;
  if (t.id === 'rescan') return scan();
  if (t.dataset.trust) {
    if (!confirm('Let this app send data without asking from now on?\n\nYou can undo this under Decisions.')) return;
    try { toast((await api('uploads/trust', { id: t.dataset.trust })).message, 5000); selected = null; await scan(); } catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.untrust) {
    try { toast((await api('uploads/untrust', { key: t.dataset.untrust })).message); renderDecisions(); } catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.dec) {
    const msgs = { revoke: 'Remove the rule this decision saved?\n\nClaude Code will ask you again next time.', block: 'Block this from now on?\n\nClaude Code won\'t be allowed to do it, and won\'t ask. You can unblock it here later.', unblock: 'Unblock this?\n\nClaude Code will ask you again next time.' };
    if (!confirm(msgs[t.dataset.dec])) return;
    try { toast((await api('decisions/change', { id: t.dataset.did, action: t.dataset.dec })).message, 5000); await scan(); }
    catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.pick) { picked.has(t.dataset.pick) ? picked.delete(t.dataset.pick) : picked.add(t.dataset.pick); return renderList(); }
  if (t.dataset.pickall !== undefined) { const ids = window._shownIds || []; const all = ids.length && ids.every(i => picked.has(i)); ids.forEach(i => all ? picked.delete(i) : picked.add(i)); return renderList(); }
  if (t.dataset.bulk === 'clear') { picked.clear(); return renderList(); }
  if (t.dataset.bulk === 'review') {
    for (const i of picked) await api('review', { id: i, on: true });
    toast(`Marked ${picked.size} as reviewed`, 2000); picked.clear(); return scan();
  }
  if (t.dataset.bulk === 'revoke') {
    const fs = data.findings.filter(f => picked.has(f.id) && canRevoke(f));
    const list = fs.slice(0, 12).map(f => `• ${f.agent}: ${f.title}`).join('\n') + (fs.length > 12 ? `\n…and ${fs.length - 12} more` : '');
    if (!confirm(`Revoke ${fs.length} grant${fs.length === 1 ? '' : 's'}?\n\n${list}\n\nBackups are saved where possible, so you can undo from History.`)) return;
    t.disabled = true;
    try { toast((await api('revoke-many', { ids: fs.map(f => f.id) })).message, 7000); picked.clear(); selected = null; await scan(); }
    catch (err) { toast('Couldn\'t revoke: ' + err.message); t.disabled = false; }
    return;
  }
  if (t.dataset.exp !== undefined) {
    try { toast((await api('expiry', { id: t.dataset.for, hours: t.dataset.exp ? Number(t.dataset.exp) : 0 })).message, 4000); await scan(); }
    catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.openapp) { try { toast((await api('open-app', { id: t.dataset.openapp })).message, 6000); } catch (err) { toast(err.message); } return; }
  if (t.dataset.ackall !== undefined) { await api('ack', {}); toast('All marked as seen', 2000); if (view === 'new') view = 'overview'; return scan(); }
  if (t.dataset.view) { view = t.dataset.view; agentFilter = t.dataset.agent || null; ui.risk = ''; $('#content').scrollTop = 0; return render(); }
  if (t.dataset.go) { view = t.dataset.go; agentFilter = null; ui.risk = t.dataset.risk || ''; $('#content').scrollTop = 0; return render(); }
  if (t.closest('#seg')) { ui.risk = t.dataset.risk; return renderMain(); }
  if (t.dataset.close !== undefined) { selected = null; return render(); }
  if (t.dataset.id) { selected = selected === t.dataset.id ? null : t.dataset.id; document.querySelectorAll('.item').forEach(i => i.classList.toggle('sel', i.dataset.id === selected)); return renderInspector(); }
  if (t.dataset.revoke) {
    const f = data.findings.find(x => x.id === t.dataset.revoke);
    if (!confirm(`Revoke "${f.title}" from ${f.agent}?\n\n${f.detail}\n\nA backup is saved first, so you can undo this from History.`)) return;
    t.disabled = true;
    try { toast((await api('revoke', { id: f.id })).message, 6000); selected = null; await scan(); }
    catch (err) { toast('Couldn\'t revoke: ' + err.message); t.disabled = false; }
  }
  if (t.dataset.rev) {
    await api('review', { id: t.dataset.rev, on: t.dataset.on === '1' });
    toast(t.dataset.on === '1' ? 'Marked as reviewed' : 'Marked as not reviewed', 2000);
    await scan();
  }
  if (t.dataset.restore) {
    if (!confirm('Restore this file from its backup?\n\nThe current version is backed up first.')) return;
    try { toast((await api('restore', { name: t.dataset.restore })).message); await scan(); renderHistory(); }
    catch (err) { toast('Couldn\'t restore: ' + err.message); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; renderMain(); }
  if (e.target.id === 'hideRev') { ui.hideReviewed = e.target.checked; renderMain(); }
  if (e.target.id === 'scopeSw') {
    api('settings', { scope: e.target.checked ? 'all' : 'ai' }).then(r => { toast(r.scope === 'all' ? 'Now watching every app for macOS permissions and background jobs' : 'Watching AI apps only', 4000); scan(); });
  }
  if (e.target.id === 'gateSw') {
    const on = e.target.checked;
    if (on && !confirm('Ask before Claude Code acts?\n\nWhenever Claude Code is about to ask for permission, a window pops up here so you can Allow or Deny. This adds a hook to ~/.claude/settings.json (a backup is saved). If this app isn\'t running, Claude Code asks the usual way.')) { e.target.checked = false; return; }
    api('gate/install', { on }).then(r => { toast(r.message, 5000); scan(); }).catch(err => { toast(err.message); scan(); });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && selected) { selected = null; render(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'f' && view !== 'overview') { e.preventDefault(); $('#q')?.focus(); }
});
$('#content').addEventListener('scroll', e => $('#head').classList.toggle('scrolled', e.target.scrollTop > 4));
// ---------- appearance: System / Light / Dark ----------
let theme = 'system';
function applyTheme(t, save) {
  theme = ['light', 'dark'].includes(t) ? t : 'system';
  if (theme === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('theme', theme); } catch {}
  const b = $('#themeBtn');
  if (b) { b.innerHTML = icon({ system: 'auto', light: 'sun', dark: 'moon' }[theme]); b.title = `Appearance: ${theme[0].toUpperCase() + theme.slice(1)} (click to change)`; }
  nativeCmd('setTheme', { theme }); // the Mac app also switches its sidebar, popups and dialogs
  if (save) api('settings', { theme }).catch(() => {});
}
$('#themeBtn').addEventListener('click', () => {
  const next = { system: 'light', light: 'dark', dark: 'system' }[theme];
  applyTheme(next, true);
  toast(`Appearance: ${next === 'system' ? 'match the Mac' : next}`, 1500);
});

// ---------- welcome / setup ----------
let themeLoaded = false;
let setupStep = 0, setupShownOnce = false, nativeInfo = { native: false, login: false, inApplications: false };
const isNative = () => !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.native);
const nativeCmd = (cmd, extra = {}) => { if (isNative()) window.webkit.messageHandlers.native.postMessage({ cmd, ...extra }); };
window.nativeState = st => { nativeInfo = st; renderSetup(); };
function openSetup(step = 0) { setupStep = step; $('#setup').classList.add('open'); nativeCmd('getState'); renderSetup(); }
function closeSetup() { $('#setup').classList.remove('open'); api('settings', { onboarded: true }).catch(() => {}); }

function renderSetup() {
  if (!data || !$('#setup').classList.contains('open')) return;
  const fda = data.tcc.readable.length > 0;
  const pill = (ok, yes, no) => `<span class="ok-pill ${ok ? 'yes' : 'no'}">${ok ? '✓ ' + yes : no}</span>`;
  const big = k => `<div class="sbig">${icon(k)}</div>`;
  const STEPS = [
    () => `${big('Permission mode')}<div class="stepno">Welcome</div>
      <h2>Know what your AI agents can do</h2>
      <p class="lead">AI Access Auditor finds every permission, folder, login and privilege your AI agents have, and lets you take any of it back. Let's switch on the protection. It takes about a minute.</p>
      <div class="srow"><span class="ic medium">${icon('info')}</span><div><b>Pops up the moment something changes</b><p>When any agent gains access or starts with its safety off, a window asks you to keep it or remove it.</p></div></div>
      <div class="srow"><span class="ic low">${icon('history')}</span><div><b>Everything can be undone</b><p>Each change is backed up first. Restore it from History at any time.</p></div></div>`,
    () => `${big('macOS privacy')}<div class="stepno">Step 1 of 3</div>
      <h2>Let it see macOS permissions</h2>
      <p class="lead">To check which apps can record your screen, control your Mac or read all your files, the app needs <b>Full Disk Access</b>. It only reads the permission list and never changes it without asking you.</p>
      <div class="srow"><div style="flex:1"><b>Full Disk Access</b><p>${fda ? 'Granted. macOS permissions are included in every scan.' : 'Not granted yet.'}</p></div>${pill(fda, 'Granted', 'Not yet')}</div>
      ${fda ? '' : `<ol class="steps">
        <li>Click <b>Open System Settings</b>.</li>
        <li>Click <b>+</b> and choose <b>AI Access Auditor</b>${isNative() ? ' (or drag it in from the Finder window)' : ''}.</li>
        <li>Turn it on, then click <b>Restart app</b>.</li></ol>
      <div class="sbtns">
        <a class="btn primary" href="x-apple.systempreferences:com.apple.preference.security?Privacy_AllFiles">Open System Settings</a>
        ${isNative() ? `<button class="btn" data-native="revealApp">Show app in Finder</button><button class="btn" data-native="relaunch">Restart app</button>` : '<button class="btn" data-recheck>Check again</button>'}
      </div>`}`,
    () => `${big('hand')}<div class="stepno">Step 2 of 3</div>
      <h2>Ask me before Claude Code acts</h2>
      <p class="lead">Instead of Claude Code's own prompt, a window pops up here so you can <b>Allow</b> or <b>Deny</b>, and change your mind later under Decisions. If this app isn't running, Claude Code asks the usual way.</p>
      <div class="srow"><span class="ic ${gateOn ? 'low' : 'medium'}">${icon('Tool permission')}</span><div><b>Ask before Claude Code acts</b><p>Adds a small hook to ~/.claude/settings.json (a backup is saved).</p></div>
        <label class="switch"><input type="checkbox" data-setsw="gate" ${gateOn ? 'checked' : ''}></label></div>
      <p class="detail">Other agents don't offer a way to pause them, so for them you're told within seconds of any change instead.</p>`,
    () => `${big('history')}<div class="stepno">Step 3 of 3</div>
      <h2>Keep watching in the background</h2>
      <p class="lead">The app lives in the menu bar. It keeps working after you close this window.</p>
      ${isNative() ? `<div class="srow"><span class="ic ${nativeInfo.login ? 'low' : 'medium'}">${icon('history')}</span><div><b>Open at Login</b><p>${nativeInfo.inApplications ? 'Starts quietly in the menu bar when you log in.' : 'Move the app to Applications first, so it can always be found at login.'}</p></div>
        <label class="switch"><input type="checkbox" data-setsw="login" ${nativeInfo.login ? 'checked' : ''}></label></div>` : ''}
      <div class="srow"><span class="ic low">${icon('auto')}</span><div><b>Appearance</b><p>Match the Mac, or always light or dark.</p></div>
        <div class="seg" style="margin-left:auto;align-self:center">${['system', 'light', 'dark'].map(t => `<button data-theme-pick="${t}" class="${theme === t ? 'on' : ''}">${t === 'system' ? 'Auto' : t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div></div>
      <div class="srow"><span class="ic low">${icon('macOS privacy')}</span><div><b>Watch all apps, not just AI</b><p>Also cover camera, screen, files and background jobs for every other app.</p></div>
        <label class="switch"><input type="checkbox" data-setsw="scope" ${scope === 'all' ? 'checked' : ''}></label></div>`,
    () => `${big('Trusted folder')}<div class="stepno">All set</div>
      <h2>You're protected</h2>
      <p class="lead">Here's what's switched on. You can change any of it later from <b>Setup</b> at the bottom of the sidebar.</p>
      <div class="srow"><div style="flex:1"><b>Live popups for new access</b><p>Watching ${data.findings.length} grants across ${new Set(data.findings.map(f => f.agent)).size} agents.</p></div>${pill(true, 'On', '')}</div>
      <div class="srow"><div style="flex:1"><b>macOS permissions</b></div>${pill(fda, 'Included', 'Needs Full Disk Access')}</div>
      <div class="srow"><div style="flex:1"><b>Ask before Claude Code acts</b></div>${pill(gateOn, 'On', 'Off')}</div>
      ${isNative() ? `<div class="srow"><div style="flex:1"><b>Open at Login</b></div>${pill(nativeInfo.login, 'On', 'Off')}</div>` : ''}`,
  ];
  const last = STEPS.length - 1;
  $('#sbox').innerHTML = STEPS[setupStep]() + `
    <div class="sfoot"><div class="dots">${STEPS.map((_, i) => `<i class="${i === setupStep ? 'on' : ''}"></i>`).join('')}</div>
      ${setupStep > 0 && setupStep < last ? '<button class="btn ghost" data-snav="-1">Back</button>' : ''}
      ${setupStep === 0 ? '<button class="btn ghost" data-sclose>Not now</button>' : ''}
      ${setupStep < last ? `<button class="btn primary" data-snav="1">${setupStep === 0 ? 'Set up' : 'Continue'}</button>` : '<button class="btn primary" data-sclose>Start using it</button>'}
    </div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-theme-pick],[data-setup-step],[data-setup],[data-snav],[data-sclose],[data-native],[data-recheck]');
  if (!t) return;
  if (t.dataset.themePick) { applyTheme(t.dataset.themePick, true); return renderSetup(); }
  if (t.dataset.setupStep) return openSetup(Number(t.dataset.setupStep));
  if (t.dataset.setup !== undefined) return openSetup(0);
  if (t.dataset.snav) { setupStep = Math.max(0, setupStep + Number(t.dataset.snav)); return renderSetup(); }
  if (t.dataset.sclose !== undefined) return closeSetup();
  if (t.dataset.native) return nativeCmd(t.dataset.native);
  if (t.dataset.recheck !== undefined) return scan();
});
document.addEventListener('change', async e => {
  const k = e.target.dataset && e.target.dataset.setsw;
  if (!k) return;
  const on = e.target.checked;
  try {
    if (k === 'gate') toast((await api('gate/install', { on })).message, 4000);
    if (k === 'scope') await api('settings', { scope: on ? 'all' : 'ai' });
    if (k === 'login') nativeCmd('setLogin', { on });
  } catch (err) { toast(err.message); }
  await scan();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#setup').classList.contains('open')) closeSetup(); });
window.addEventListener('focus', () => { if ($('#setup').classList.contains('open')) scan(); }); // pick up Full Disk Access after coming back from Settings

// Hooks the Mac app calls from the menu bar / notifications
window.rescan = scan;
window.selectFinding = async id => { await scan(); if (data.findings.some(f => f.id === id)) { view = 'all'; agentFilter = null; ui.risk = ''; ui.q = ''; ui.hideReviewed = false; selected = id; render(); document.querySelector(`[data-id="${id}"]`)?.scrollIntoView({ block: 'center' }); } };
// openSetup is a top-level function, so the Mac app can already call window.openSetup()
applyTheme((() => { try { return localStorage.getItem('theme'); } catch { return null; } })(), false);
window.showView = v => { view = v; agentFilter = null; selected = null; scan(); };
scan();
</script>
</body>
</html>
