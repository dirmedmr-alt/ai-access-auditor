name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste API keys, tokens or other secrets: the app masks them, but logs and screenshots you copy elsewhere may not be masked.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Click ...
        3. See ...
  - type: input
    id: version
    attributes:
      label: App version
      description: "Mac: menu AI Access Auditor → About. Windows and Linux: the number in the file you downloaded, or under Settings → Apps."
      placeholder: "1.0.8"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Windows (ARM)
        - Linux (x64)
        - Linux (ARM)
    validations:
      required: true
  - type: input
    id: osversion
    attributes:
      label: System version
      placeholder: "macOS 15.2, Windows 11 24H2, Ubuntu 24.04..."
  - type: input
    id: agents
    attributes:
      label: Which agents are involved?
      placeholder: "Claude Code, Codex CLI, Cursor..."
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or error messages
      description: Optional. Check that no secrets are visible before posting.
