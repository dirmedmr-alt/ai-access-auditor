<!doctype html>
<!-- The Allow / Deny and Keep / Remove popup (the Linux version of macos/prompt.swift) -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
:root{--bg:#fbfbfd;--fg:#1d1d1f;--sub:#6e6e73;--box:rgba(0,0,0,.055);--line:rgba(0,0,0,.12);--btn:#fff;--btnfg:#1d1d1f;--accent:#2f6fe4;
  --high:#e5383b;--medium:#f08c00;--low:#2f9e44;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:#2a2a2c;--fg:#f2f2f4;--sub:#a1a1a6;--box:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--btn:#3a3a3c;--btnfg:#f2f2f4;--accent:#3d7cf0}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Ubuntu,Cantarell,"Noto Sans",sans-serif;overflow:hidden;user-select:none}
:lang(ar) body{font-family:system-ui,"Noto Sans Arabic","Noto Naskh Arabic","DejaVu Sans",sans-serif}
.wrap{padding:18px 20px 16px;border:1px solid var(--line);-webkit-app-region:drag}
.x{position:absolute;inset-inline-end:8px;top:8px;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--sub);font-size:17px;line-height:1;cursor:pointer;-webkit-app-region:no-drag}
.x:hover{background:var(--box);color:var(--fg)}
.head{display:flex;gap:14px;align-items:flex-start;padding-inline-end:20px}
.ic{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center}
.ic svg{width:24px;height:24px}
.titles{min-width:0;flex:1}
h1{font-size:15px;font-weight:600;margin:0 0 3px;overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:start}
.sub{font-size:12px;color:var(--sub);margin:0 0 5px;overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:start}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:4px}
:lang(ar) .pill{letter-spacing:0}
.box{margin-top:14px;background:var(--box);border-radius:8px;padding:8px 10px;font:12px/1.45 ui-monospace,"DejaVu Sans Mono","Liberation Mono",monospace;
  white-space:pre-wrap;overflow-wrap:anywhere;max-height:9.2em;overflow:auto;direction:ltr;text-align:left;user-select:text;-webkit-app-region:no-drag}
.foot{margin:12px 0 0;font-size:11px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center;margin-top:14px;-webkit-app-region:no-drag}
.row .sp{flex:1}
select,button.b{font:inherit;font-size:13px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--btn);color:var(--btnfg);padding:0 14px}
select{padding:0 8px;max-width:190px}
button.b{cursor:pointer;min-width:84px}
button.b:hover{filter:brightness(.97)}
button.b.primary{background:var(--accent);border-color:transparent;color:#fff}
button.b.primary.red{background:var(--high)}
button.b.danger{color:var(--high)}
button.b:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<div class="wrap" id="w"></div>
<script>
const ICONS = {
  terminal: '<path d="M4 17l6-5-6-5M12 19h8"/>',
  server: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  pencil: '<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  hand: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5V4a1.5 1.5 0 0 1 3 0v8M14 11.5V5.5a1.5 1.5 0 0 1 3 0V14"/><path d="M17 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L3.3 16a1.6 1.6 0 0 1 2.4-2.1L8 16"/>',
  upload: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 18v-6M9 14.5l3-3 3 3"/>',
  bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16.5h.01"/>',
};
const RISK = { high: [' HIGH RISK ', 'var(--high)'], medium: [' MEDIUM RISK ', 'var(--medium)'], low: [' LOW RISK ', 'var(--low)'] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

popup.content().then(c => {
  if (!c) return;
  document.documentElement.lang = c.lang;
  document.documentElement.dir = c.rtl ? 'rtl' : 'ltr';
  document.title = c.title;
  const [pillText, color] = RISK[c.risk] || RISK.medium;
  // Enter picks the safe choice for high-risk requests, so a reflexive Enter can't approve them
  const denyFirst = !!c.safeDefault;
  const opts = (c.options || []).length ? `<select id="opt">${c.options.map((o, i) => `<option value="${i}">${esc(o)}</option>`).join('')}</select>` : '';
  document.getElementById('w').innerHTML = `
    <button class="x" id="x" aria-label="Close">×</button>
    <div class="head">
      <div class="ic" style="background:color-mix(in srgb, ${color} 16%, transparent);color:${color}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[c.symbol] || ICONS.shield}</svg></div>
      <div class="titles"><h1>${esc(c.title)}</h1><p class="sub">${esc(c.subtitle)}</p>
        <span class="pill" style="color:${color};background:color-mix(in srgb, ${color} 14%, transparent)">${esc((c.pills || {})[c.risk] || pillText.trim())}</span></div>
    </div>
    <div class="box">${esc(c.detail || '—')}</div>
    ${c.footnote ? `<p class="foot">${esc(c.footnote)}</p>` : ''}
    <div class="row">${opts}<span class="sp"></span>
      <button class="b ${denyFirst ? 'primary red' : c.destructive ? 'danger' : ''}" id="deny">${esc(c.denyTitle)}</button>
      <button class="b ${denyFirst ? '' : 'primary'}" id="allow">${esc(c.allowTitle)}</button></div>`;
  const option = () => { const s = document.getElementById('opt'); return s ? Number(s.value) : 0; };
  document.getElementById('allow').onclick = () => popup.decide(true, option());
  document.getElementById('deny').onclick = () => popup.decide(false, option());
  document.getElementById('x').onclick = () => popup.decide(null, 0);
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !(e.target instanceof HTMLSelectElement)) { e.preventDefault(); popup.decide(!denyFirst, option()); }
    if (e.key === 'Escape' && !denyFirst) { e.preventDefault(); popup.decide(false, option()); }
  });
  requestAnimationFrame(() => {
    popup.ready(document.getElementById('w').getBoundingClientRect().height);
    document.getElementById(denyFirst ? 'deny' : 'allow').focus();
  });
});
</script>
</body>
</html>
